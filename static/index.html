<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title id="t">Home</title>

  <link rel="stylesheet" href="/assets/css/nav.css?v=ember2" />
  <link rel="stylesheet" href="/assets/css/h.css?v=ember2" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>try{if(sessionStorage.getItem("gh:in")){sessionStorage.removeItem("gh:in");document.documentElement.className+=" gh-in";}}catch(e){}</script>
</head>

<body>
  <!-- ═══ Splash ═══ -->
  <div id="splash-screen">
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--ink-900, #0d0c0b);
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }

      #splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .splash-mark {
        font-size: 24px;
        color: var(--brass, #d2a35d);
        margin-bottom: 18px;
        opacity: 0;
        animation: splashIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }

      .splash-title {
        font-family: var(--serif, Georgia, serif);
        font-size: 46px;
        font-weight: 300;
        font-variation-settings: "SOFT" 20, "WONK" 1;
        letter-spacing: -0.035em;
        color: var(--paper, #f4efe6);
        opacity: 0;
        animation: splashIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.22s forwards;
      }

      @keyframes splashIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* One hairline, filling from the centre. No progress bar, no percentage:
         it is a mood, not a measurement, and pretending otherwise reads cheap. */
      .splash-rule {
        width: 148px;
        height: 1px;
        margin-top: 26px;
        background: rgba(244, 239, 230, 0.1);
        position: relative;
        overflow: hidden;
      }

      .splash-rule::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, var(--brass, #d2a35d), transparent);
        transform: translateX(-100%);
        animation: splashSweep 1.5s cubic-bezier(0.5, 0, 0.5, 1) 0.4s infinite;
      }

      @keyframes splashSweep {
        to { transform: translateX(100%); }
      }
    </style>

    <i class="fa-solid fa-ghost splash-mark"></i>
    <div class="splash-title">Ghosty</div>
    <div class="splash-rule"></div>
  </div>
  <!-- ═══ End splash ═══ -->

  <div class="f-nav"></div>

  <div class="main-wrapper">
    <div class="main">
      <div class="status-pill" id="status-pill" data-state="waiting">
        <div class="status-dot"></div>
        <span id="status-text">Connecting…</span>
      </div>

      <div class="hero">
        <i class="fa-solid fa-ghost hero-mark"></i>
        <h1 class="wordmark">Ghosty</h1>
        <p class="greeting" id="greeting"><em>Where would you like to go?</em></p>
      </div>

      <div class="search-container">
        <form id="fv" method="POST" class="search-form-home">
          <i class="fa-solid fa-magnifying-glass search-icon-main"></i>
          <input id="input" autocomplete="off" spellcheck="false" placeholder="Search, or paste a link" type="text" />
          <span class="search-shortcut">/</span>
        </form>
        <div id="suggestions" class="suggestions" hidden></div>
      </div>

      <div id="recent-row" class="recent-row" hidden></div>

      <div class="home-apps-row">
        <a href="/./a" class="home-app-btn">
          <div class="home-app-icon"><i class="fa-solid fa-gamepad"></i></div>
          <div class="home-app-text">
            <span class="home-app-name">Games</span>
            <span class="home-app-sub" id="sub-games">The library</span>
          </div>
        </a>
        <a href="#" class="home-app-btn" onclick="event.preventDefault(); go('https://tubitv.com');">
          <div class="home-app-icon"><i class="fa-solid fa-film"></i></div>
          <div class="home-app-text">
            <span class="home-app-name">Movies</span>
            <span class="home-app-sub">Free on Tubi</span>
          </div>
        </a>
        <a href="/./b" class="home-app-btn">
          <div class="home-app-icon"><i class="fa-solid fa-compass"></i></div>
          <div class="home-app-text">
            <span class="home-app-name">Apps</span>
            <span class="home-app-sub">Sites &amp; tools</span>
          </div>
        </a>
      </div>

      <div class="stat-strip" id="stat-strip">
        <button class="stat-cell" type="button" onclick="(window.ghostNav||(u=>location.href=u))('/a')">
          <span class="stat-value" id="stat-games">—</span>
          <span class="stat-name">games</span>
        </button>
        <span class="stat-sep"></span>
        <button class="stat-cell" type="button" onclick="(window.ghostNav||(u=>location.href=u))('/c')">
          <span class="stat-value" id="stat-blocked">0</span>
          <span class="stat-name">trackers blocked</span>
        </button>
        <span class="stat-sep"></span>
        <button class="stat-cell" type="button" onclick="window.__ghostyPalette && window.__ghostyPalette.open()">
          <span class="stat-value"><i class="fa-solid fa-bolt"></i>Ctrl K</span>
          <span class="stat-name">search everything</span>
        </button>
      </div>
    </div>
  </div>

  <div id="discord-toast" class="toast-hidden">
    Discord no creado esperen por update 👻
  </div>

  <div class="bottom-bar">
    <div class="bb-left">
      <span><i class="fa-solid fa-ghost"></i> &nbsp;Ghosty 5.2.6</span>
      <span class="dim">ToS &nbsp;·&nbsp; Privacy &nbsp;·&nbsp; DMCA</span>
    </div>
    <div class="bb-right">
      <span><i class="fa-solid fa-shield-halved"></i> Secure</span>
      <span><i class="fa-solid fa-signal"></i> Online</span>
    </div>
  </div>

  <script>
    // A greeting costs nothing and is the one line on the page written for a
    // person rather than about the software.
    (function () {
      const el = document.getElementById("greeting");
      if (!el) return;
      const h = new Date().getHours();
      const hello =
        h < 5 ? "Still up" :
        h < 12 ? "Good morning" :
        h < 18 ? "Good afternoon" :
        "Good evening";
      el.innerHTML = hello + ". <em>Where would you like to go?</em>";
    })();

    const discordBtn = document.querySelector('.top-discord-btn');
    const toast = document.getElementById('discord-toast');
    if (discordBtn && toast) {
      discordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        toast.className = 'toast-visible';
        setTimeout(() => { toast.className = 'toast-hidden'; }, 3000);
      });
    }
  </script>
